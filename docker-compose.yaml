services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      corescope:
        condition: service_healthy

  corescope:
    image: ghcr.io/kpa-clawbot/corescope:v3.18.0
    container_name: corescope-dev
    environment:
      DISABLE_CADDY: 'true'
      DISABLE_MOSQUITTO: 'true'
    volumes:
      - ./dev/data:/app/data
    ports:
      - 13582:3000/tcp
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/healthz >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
